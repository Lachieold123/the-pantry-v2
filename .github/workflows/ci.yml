# Runs on every push and pull request: the app must typecheck, lint clean
# and pass every test before anything reaches Lachlan's phone.
# Actions are pinned to full commit SHAs (version in the comment); the node version comes from .nvmrc,
# the same one eas.json pins for EAS builds.
name: CI
on:
  push:
  pull_request:
# Read-only: CI checks code, it never writes to the repo (REL-12).
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      # Typed routes come from Expo's dev server; without them a mistyped route still typechecks (REL-12).
      - name: Generate typed routes
        run: |
          (CI=1 npx expo start --offline --port 8095 > /tmp/expo.log 2>&1 &)
          for i in $(seq 1 60); do [ -f .expo/types/router.d.ts ] && break; sleep 2; done
          pkill -f "expo start --offline --port 8095" || true
          test -f .expo/types/router.d.ts
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:domain
        env:
          TZ: Australia/Sydney
      - run: npm run test:ui
      # A production build must never show draft recipes (K-29, REL2-11).
      - run: node .github/scripts/check-eas-env.mjs
      # Catalogue gates (D-053). None needs the old app or the network; catalogue:convert does, so it is not here.
      - run: npm run catalogue:check-ingredients
      - run: npm run catalogue:check-house
      - run: npm run catalogue:check-text
      # A hard gate since 20 November 2026, when the catalogue repair brought it to 5,496 of 5,496 (REPO-6, FOOD-15).
      - run: npm run catalogue:validate -- --no-nutrition
      # The community feed upload: a recipe tagged vegan with parmesan in it fails here (REPO-2).
      - run: npm run feed:verify
      # Packages must match the Expo SDK (REL-17, K-28). A native version change also needs
      # a new development build on the Mac.
      - run: npx expo install --check

  journeys:
    # The web journey tests (D-040): the main paths, tapped through in light and dark.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      # --clear: EXPO_PUBLIC_ values are baked in, and a cached bundle can keep an old one.
      - run: npx expo export --platform web --clear
        env:
          EXPO_PUBLIC_SHOW_DRAFT_RECIPES: '1'
      - run: npm run test:web

  database:
    # Row security, sync and the database functions, on a throwaway Postgres (PGlite), never the live project.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
      # PGlite is pinned here, outside package.json, so the app's lockfile stays untouched (moving it into devDependencies is a dependency-step job).
      - run: mkdir -p /tmp/pg && cd /tmp/pg && npm init -y > /dev/null && npm i --no-audit --no-fund @electric-sql/pglite@0.3.7
      - run: node --test supabase/tests/*.test.mjs
        env:
          PGLITE: /tmp/pg/node_modules/@electric-sql/pglite/dist/index.js
