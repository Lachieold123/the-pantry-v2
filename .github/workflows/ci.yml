# Runs on every push and pull request: the app must typecheck, lint clean
# and pass every test before anything reaches Lachlan's phone.
name: CI
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:domain
        env:
          TZ: Australia/Sydney
      - run: npm run test:ui
      - run: npm run catalogue:check-ingredients
