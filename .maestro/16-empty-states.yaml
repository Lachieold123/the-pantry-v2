# Every empty state on a fresh install says what's missing and offers a next step.
# The library and stats are reached the way a person would: from the side menu.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml

# Cookmarks, from the side menu
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-saved"
- assertVisible:
    id: "cookmarks-empty"
- assertVisible:
    id: "cookmarks-empty-action"
- takeScreenshot: empty-cookmarks

# The other library tabs switch in place
- tapOn:
    id: "library-tab-collections"
- assertVisible:
    id: "collections-empty"
- takeScreenshot: empty-collections
- tapOn:
    id: "library-tab-mine"
- assertVisible:
    id: "mine-empty"
- takeScreenshot: empty-my-recipes
- tapOn:
    id: "library-tab-recent"
- assertVisible:
    id: "recent-empty"
- takeScreenshot: empty-recent

# Back to Home, then Kitchen stats from the menu
- tapOn:
    id: "back"
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-stats"
- assertVisible:
    id: "stats-empty"
- takeScreenshot: empty-stats
- tapOn:
    id: "back"

# Plan, then the List tab, empty
- tapOn:
    id: "tab-plan"
- assertVisible:
    id: "plan-screen"
- assertVisible:
    id: "plan-progress"
- assertVisible: "0 of 21 meals"
- takeScreenshot: empty-plan
- tapOn:
    id: "tab-list"
- assertVisible:
    id: "shopping-empty"
- takeScreenshot: empty-shopping-list
- tapOn:
    id: "shopping-empty-action"
- assertVisible:
    id: "plan-screen"

# Cupboard
- tapOn:
    id: "tab-cupboard"
# Under the ways to add things, so it can sit below the fold.
- scrollUntilVisible:
    element:
      id: "cupboard-empty"
    direction: DOWN
- assertVisible: "Your cupboard is empty.*"
- takeScreenshot: empty-cupboard

# Browse with nothing matching
- runFlow: subflows/_open_browse.yaml
- tapOn:
    id: "browse-search"
- inputText: "zzzzqqq"
- assertVisible:
    id: "browse-empty"
- takeScreenshot: empty-browse
- tapOn:
    id: "browse-empty-action"
- assertNotVisible:
    id: "browse-empty"
