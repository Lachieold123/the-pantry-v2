# Accounts (D-043): signed out, Settings' first section offers "Back up your
# kitchen"; on an iPhone the sheet has Continue with Apple and Not now.
# Continue with email stays hidden until email codes can be sent
# (EMAIL_CODES_CONNECTED, src/lib/emailCodes.ts); when it flips, put back the
# email step (a mistyped address is refused before sending). No real sign-in:
# Apple's sheet and a real inbox can't be automated, so those are checked by
# hand (docs/ACCOUNTS.md).
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml

- tapOn:
    id: "header-avatar"
- assertVisible:
    id: "settings-account-backup"
- tapOn:
    id: "settings-account-backup"
- assertVisible: "Back up your kitchen"
- assertVisible:
    id: "account-apple"
- assertNotVisible:
    id: "account-email"
- takeScreenshot: account-sheet

# Not now closes and nothing changes.
- tapOn:
    id: "account-not-now"
- assertVisible:
    id: "settings-account-backup"
