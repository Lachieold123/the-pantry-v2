# Accounts (D-043): signed out, Settings' first section offers "Back up your
# kitchen"; the sheet has Continue with Apple (on an iPhone), Continue with
# email and Not now; the email step checks the address before sending. No
# real sign-in: Apple's sheet and a real inbox can't be automated, so those
# are checked by hand (docs/ACCOUNTS.md).
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml

- tapOn:
    id: "header-avatar"
- assertVisible:
    id: "settings-account-backup"
- tapOn:
    id: "settings-account-backup"
- assertVisible: "Back up your kitchen"
- assertVisible:
    id: "account-email"
- takeScreenshot: account-sheet

# Not now closes and nothing changes.
- tapOn:
    id: "account-not-now"
- assertVisible:
    id: "settings-account-backup"

- tapOn:
    id: "settings-account-backup"
- tapOn:
    id: "account-email"
- assertVisible:
    id: "account-email-field"
- tapOn:
    id: "account-email-field"
- inputText: "lachlan@"
- tapOn:
    id: "account-send"
- assertVisible: "That email doesn’t look right. Check it and try again."
- takeScreenshot: account-email-step
