# The library's Recent tab and Kitchen stats (still its own page): empty, then
# filled by opening and cooking a recipe, then each cleared and restored with Undo.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml

# Both start empty. Both open from links, so Home is underneath and Back lands there.
- openLink: ${METRO_URL}/--/library?tab=recent
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "recent-empty"
    timeout: 15000
- assertNotVisible:
    id: "recent-clear"
- takeScreenshot: recent-empty
- tapOn:
    id: "back"
- openLink: ${METRO_URL}/--/stats
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "stats-empty"
    timeout: 15000
- assertVisible: "No cooks logged yet"
- assertVisible:
    id: "stats-empty"
- takeScreenshot: stats-empty
- tapOn:
    id: "stats-empty-action"
- assertVisible: "Discover"
# Browse opened over Kitchen stats: back twice to Home.
- tapOn:
    id: "back"
- assertVisible:
    id: "stats-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"

# Open a recipe and mark it cooked
- runFlow:
    file: subflows/_open_recipe.yaml
    env:
      QUERY: carbonara
      RECIPE_ID: carbonara
- tapOn:
    id: "recipe-mark-cooked"
- assertVisible: "Marked as cooked"
- tapOn:
    id: "back"

# Recent lists it and opens it
- openLink: ${METRO_URL}/--/library?tab=recent
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "recipe-card-carbonara"
    timeout: 15000
- assertVisible: "1 recipe"
- assertVisible:
    id: "recipe-card-carbonara"
- takeScreenshot: recent-one
- tapOn:
    id: "recipe-card-carbonara"
- assertVisible:
    id: "recipe-screen"
- tapOn:
    id: "back"

# Clear, then Undo
- tapOn:
    id: "recent-clear"
- assertVisible: "Recent list cleared"
- assertVisible:
    id: "recent-empty"
- tapOn:
    id: "toast-undo"
- assertVisible:
    id: "recipe-card-carbonara"
- tapOn:
    id: "back"

# Kitchen stats counts the cook
- openLink: ${METRO_URL}/--/stats
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "stats-screen"
    timeout: 15000
- assertVisible: "1 day cooking streak"
- assertVisible: "Total cooks: 1"
- assertVisible: "Best streak: 1"
# Most cooked comes after the tiles and top cuisines, so it can sit below the fold.
- scrollUntilVisible:
    element:
      text: "1. Carbonara, once"
    direction: DOWN
- assertVisible:
    id: "stats-most-cooked"
- takeScreenshot: stats-one

# Clear the history, then Undo
- scrollUntilVisible:
    element:
      id: "stats-clear"
- tapOn:
    id: "stats-clear"
- assertVisible: "Cooking history cleared"
- assertVisible:
    id: "stats-empty"
- tapOn:
    id: "toast-undo"
- assertVisible: "1 day cooking streak"
