# Recently viewed and Kitchen stats: empty, then filled by opening and cooking
# a recipe, then each cleared and restored with Undo.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml

# Both start empty
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-recent"
- assertVisible:
    id: "recent-empty"
- assertNotVisible:
    id: "recent-clear"
- takeScreenshot: recent-empty
- tapOn:
    id: "back"
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-stats"
- assertVisible: "No cooks logged yet"
- assertVisible:
    id: "stats-empty"
- takeScreenshot: stats-empty
- tapOn:
    id: "stats-empty-action"
- assertVisible: "Discover"

# Open a recipe and mark it cooked
- runFlow:
    file: subflows/_open_recipe.yaml
    env:
      QUERY: carbonara
      RECIPE_ID: carbonara
- tapOn:
    id: "recipe-mark-cooked"
- assertVisible: "Marked as cooked"
- tapOn:
    id: "back"

# Recently viewed lists it and opens it
- tapOn:
    id: "header-menu"
- assertVisible: "Recently viewed, 1"
- tapOn:
    id: "menu-recent"
- assertVisible: "1 recipe"
- assertVisible:
    id: "recipe-card-carbonara"
- takeScreenshot: recent-one
- tapOn:
    id: "recipe-card-carbonara"
- assertVisible:
    id: "recipe-screen"
- tapOn:
    id: "back"

# Clear, then Undo
- tapOn:
    id: "recent-clear"
- assertVisible: "Recently viewed cleared"
- assertVisible:
    id: "recent-empty"
- tapOn:
    id: "toast-undo"
- assertVisible:
    id: "recipe-card-carbonara"
- tapOn:
    id: "back"

# Kitchen stats counts the cook
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-stats"
- assertVisible: "1 day cooking streak"
- assertVisible: "Total cooks: 1"
- assertVisible: "Best streak: 1"
- assertVisible:
    id: "stats-most-cooked"
- assertVisible: "1. Carbonara, once"
- takeScreenshot: stats-one

# Clear the history, then Undo
- scrollUntilVisible:
    element:
      id: "stats-clear"
- tapOn:
    id: "stats-clear"
- assertVisible: "Cooking history cleared"
- assertVisible:
    id: "stats-empty"
- tapOn:
    id: "toast-undo"
- assertVisible: "1 day cooking streak"
