# First launch: Skip goes straight to the app, with picks to swipe through.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml
- assertVisible:
    id: "home-heroes"
- assertVisible: ".*Picked for you.*"
- takeScreenshot: welcome-skipped-feed

# Skipping counts as onboarded: a relaunch (state kept) opens on the Feed, not the quiz.
- launchApp:
    clearState: false
- openLink: ${METRO_URL}
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "feed-screen"
    timeout: 60000
- assertNotVisible:
    id: "welcome-skip"
