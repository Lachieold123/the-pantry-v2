# Settings: appearance, high contrast, units, the four cooking preferences,
# the Sunday reminder, and redoing the welcome flow.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml
- tapOn:
    id: "header-avatar"
- assertVisible:
    id: "settings-screen"
- assertVisible: "Preferences"

# Appearance: dark, light, then back to matching the phone
- tapOn:
    id: "segment-dark"
- takeScreenshot: settings-dark
- tapOn:
    id: "segment-light"
- takeScreenshot: settings-light
- tapOn:
    id: "segment-system"

# High contrast on, then off
- tapOn:
    id: "settings-high-contrast"
- takeScreenshot: settings-high-contrast
- tapOn:
    id: "settings-high-contrast"

# Cooking: each row opens a small sheet with just that choice.
- scrollUntilVisible:
    element:
      id: "settings-cooking-diet"
    direction: DOWN
- tapOn:
    id: "settings-cooking-diet"
- tapOn:
    id: "settings-diet-vegetarian"
- tapOn:
    id: "settings-editor-done"
- assertVisible: "Vegetarian"
- tapOn:
    id: "settings-cooking-avoid"
- tapOn:
    id: "settings-avoid-nuts"
- tapOn:
    id: "settings-avoid-word"
- inputText: "coriander"
- pressKey: Enter
- assertVisible: "coriander ×"
- takeScreenshot: settings-food
- tapOn:
    id: "settings-avoid-custom-coriander"
- assertNotVisible:
    id: "settings-avoid-custom-coriander"
- tapOn:
    id: "settings-avoid-nuts"
- hideKeyboard
- tapOn:
    id: "settings-editor-done"
- assertVisible: "Nothing"
- tapOn:
    id: "settings-cooking-cuisines"
- tapOn:
    id: "settings-cuisine-italian"
- tapOn:
    id: "settings-editor-done"
- assertVisible: "1 picked"
- tapOn:
    id: "settings-cooking-weeknight"
- tapOn:
    id: "settings-weeknight-under-30"
- tapOn:
    id: "settings-editor-done"
- assertVisible: "≤ 30 min"
- tapOn:
    id: "settings-cooking-diet"
- tapOn:
    id: "settings-diet-everything"
- tapOn:
    id: "settings-editor-done"

# Sunday reminder: iOS asks for permission the first time.
- scrollUntilVisible:
    element:
      id: "settings-sunday-reminder"
    direction: DOWN
- tapOn:
    id: "settings-sunday-reminder"
- tapOn:
    text: "Allow"
    optional: true
- takeScreenshot: settings-reminder

# Units
- scrollUntilVisible:
    element:
      id: "segment-imperial"
    direction: UP
- tapOn:
    id: "segment-imperial"
- takeScreenshot: settings-imperial
- tapOn:
    id: "segment-metric"

# Retake the taste quiz, and skip out of it again
- scrollUntilVisible:
    element:
      id: "settings-retake-quiz"
    direction: DOWN
- tapOn:
    id: "settings-retake-quiz"
- assertVisible:
    id: "welcome-start"
- tapOn:
    id: "welcome-skip"
- assertVisible:
    id: "feed-screen"
