# The shell: the four tabs and the centre "+", the side menu to every destination and back, adding a recipe and the avatar.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml

# Tab bar
- runFlow: subflows/_open_browse.yaml
- assertVisible: "Discover"
- tapOn:
    id: "back"
- tapOn:
    id: "tab-cupboard"
- assertVisible:
    id: "cupboard-screen"
- tapOn:
    id: "tab-plan"
- assertVisible:
    id: "plan-screen"
- tapOn:
    id: "tab-list"
- assertVisible:
    id: "shopping-screen"
- tapOn:
    id: "tab-index"
- assertVisible:
    id: "feed-screen"

# Side menu: open, look, close by tapping the backdrop beside the panel.
- tapOn:
    id: "header-menu"
- assertVisible:
    id: "menu-feed"
- assertVisible: "Local profile"
- takeScreenshot: menu-open
- tapOn:
    id: "menu-close"
    point: "95%,50%"
- assertNotVisible:
    id: "menu-feed"

# Side menu: the tabs
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-browse"
- assertVisible: "Discover"
- tapOn:
    id: "back"
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-cupboard"
- assertVisible:
    id: "cupboard-screen"
# The menu opens over the tab you're on, dimmed behind it, not over a blank page.
- tapOn:
    id: "header-menu"
- assertVisible:
    id: "menu-feed"
- takeScreenshot: menu-over-cupboard
- tapOn:
    id: "menu-close"
    point: "95%,50%"
- assertVisible:
    id: "cupboard-screen"
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-plan"
- assertVisible:
    id: "plan-screen"
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-feed"
- assertVisible:
    id: "feed-screen"

# Side menu: the pages, each with a way back
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-saved"
- assertVisible:
    id: "cookmarks-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"

- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-collections"
- assertVisible:
    id: "collections-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"

- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-my-recipes"
- assertVisible:
    id: "my-recipes-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"

- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-recent"
- assertVisible:
    id: "recent-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"

- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-stats"
- assertVisible:
    id: "stats-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"

- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-spinner"
- assertVisible: 'Can.t decide\?'
- tapOn:
    id: "sheet-close"
- assertVisible:
    id: "feed-screen"

- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-settings"
- assertVisible:
    id: "settings-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"

- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-profile"
- assertVisible:
    id: "settings-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"

# Browse's "+" opens the recipe editor; Cancel with nothing typed just closes it.
- runFlow: subflows/_open_browse.yaml
- tapOn:
    id: "browse-add-recipe"
- assertVisible: "New recipe"
- takeScreenshot: editor-new
- tapOn:
    id: "editor-cancel"
- assertVisible: "Discover"
- tapOn:
    id: "back"

# The centre "+" opens "Share a dish"; Close with nothing typed just closes it.
- tapOn:
    id: "tab-add"
- assertVisible: "Share a dish"
- assertVisible:
    id: "post-add-photo"
- takeScreenshot: post-new
- tapOn:
    id: "post-share"
- assertVisible: "Almost there: add a photo and name the dish."
- tapOn:
    id: "post-close"
- assertVisible:
    id: "feed-screen"

# The menu has the shopping list too.
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-list"
- assertVisible:
    id: "shopping-screen"
- tapOn:
    id: "tab-index"

# The avatar opens Settings.
- tapOn:
    id: "header-avatar"
- assertVisible:
    id: "settings-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"
