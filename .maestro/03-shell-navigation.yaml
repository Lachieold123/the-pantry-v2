# The shell: exactly four tabs (no centre "+", no side menu), and the avatar's
# You page to every other place and back: the library's four tabs, Kitchen
# stats, Share a dish, Surprise me, Household, Pro and Settings.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml

# Tab bar: four tabs, nothing in the middle, no menu button.
- assertNotVisible:
    id: "tab-add"
- assertNotVisible:
    id: "header-menu"
- runFlow: subflows/_open_browse.yaml
- assertVisible: "Discover"
# Adding your own recipe lives in Library → My recipes, not Browse.
- assertNotVisible:
    id: "browse-add-recipe"
- tapOn:
    id: "back"
- tapOn:
    id: "tab-cupboard"
- assertVisible:
    id: "cupboard-screen"
- tapOn:
    id: "tab-plan"
- assertVisible:
    id: "plan-screen"
- tapOn:
    id: "tab-list"
- assertVisible:
    id: "shopping-screen"
- tapOn:
    id: "tab-index"
- assertVisible:
    id: "feed-screen"

# The avatar opens You, a page with a back button.
- tapOn:
    id: "header-avatar"
- assertVisible:
    id: "you-screen"
- assertVisible: "Library"
- assertVisible: "Kitchen"
- takeScreenshot: you
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"

# Library: each row opens the library on its tab, with a way back to You.
- tapOn:
    id: "header-avatar"
- tapOn:
    id: "you-cookmarks"
- assertVisible:
    id: "cookmarks-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "you-screen"
- tapOn:
    id: "you-collections"
- assertVisible:
    id: "collections-screen"
- tapOn:
    id: "back"
- tapOn:
    id: "you-my-recipes"
- assertVisible:
    id: "my-recipes-screen"
- tapOn:
    id: "back"
- tapOn:
    id: "you-recent"
- assertVisible:
    id: "recent-screen"
- tapOn:
    id: "back"

# Kitchen
- tapOn:
    id: "you-stats"
- assertVisible:
    id: "stats-screen"
- tapOn:
    id: "back"
- tapOn:
    id: "you-post"
- assertVisible:
    id: "post-screen"
- tapOn:
    id: "post-close"
- assertVisible:
    id: "you-screen"
- tapOn:
    id: "you-surprise"
- assertVisible:
    id: "surprise-screen"
- tapOn:
    id: "surprise-back"
- assertVisible:
    id: "you-screen"

# Sharing and Pro
- tapOn:
    id: "you-household"
- assertVisible:
    id: "household-screen"
- tapOn:
    id: "back"
- tapOn:
    id: "you-pro"
- assertVisible:
    id: "pro-benefits"
- tapOn:
    id: "pro-done"
- assertVisible:
    id: "you-screen"

# Settings
- tapOn:
    id: "you-settings"
- assertVisible:
    id: "settings-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "you-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"
