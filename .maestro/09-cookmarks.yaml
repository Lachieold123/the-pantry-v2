# The library's Cookmarks tab (v1's "Saved" page): the empty state and its way
# out, then a saved recipe listed as a cream card, opened, unsaved from its
# disc and put back with Undo, and the tabs switching in place.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml

# The library opens from a link, so Home is underneath and Back lands there.
- openLink: ${METRO_URL}/--/library?tab=cookmarks
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "cookmarks-empty"
    timeout: 15000
- assertVisible:
    id: "library-screen"
- assertVisible: "Nothing saved yet"
- assertVisible: "0 saved recipes"
- takeScreenshot: cookmarks-empty
- tapOn:
    id: "cookmarks-empty-action"
- assertVisible: "Discover"
# Browse opened over the library: back twice to Home.
- tapOn:
    id: "back"
- assertVisible:
    id: "cookmarks-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"

# Save one from its page
- runFlow:
    file: subflows/_open_recipe.yaml
    env:
      QUERY: carbonara
      RECIPE_ID: carbonara
- tapOn:
    id: "recipe-save"
- assertVisible: "Saved to Cookmarks"
- tapOn:
    id: "back"

- openLink: ${METRO_URL}/--/library?tab=cookmarks
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "recipe-card-carbonara"
    timeout: 15000
- assertVisible: "1 saved recipe"
- takeScreenshot: cookmarks-one
- tapOn:
    id: "recipe-card-carbonara"
- assertVisible:
    id: "recipe-screen"
- assertVisible: "Saved"
- tapOn:
    id: "back"
- assertVisible:
    id: "cookmarks-screen"

# Unsave from the card's disc; Undo puts it back. The disc is inside the card,
# which is one button to iOS, so tap its spot: the photo's top-right corner.
- tapOn:
    id: "recipe-card-carbonara"
    point: "87%,8%"
- assertVisible: "Removed from Cookmarks"
- assertVisible:
    id: "cookmarks-empty"
- tapOn:
    id: "toast-undo"
- assertVisible:
    id: "recipe-card-carbonara"

# The tabs switch in place, and the head's count follows the tab.
- tapOn:
    id: "library-tab-collections"
- assertVisible:
    id: "collections-empty"
- assertVisible: "0 collections"
- tapOn:
    id: "library-tab-mine"
- assertVisible:
    id: "mine-empty"
- tapOn:
    id: "library-tab-recent"
- assertVisible:
    id: "recent-screen"
- tapOn:
    id: "library-tab-cookmarks"
- assertVisible:
    id: "recipe-card-carbonara"
- takeScreenshot: library-tabs
