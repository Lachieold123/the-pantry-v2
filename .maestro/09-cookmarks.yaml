# Cookmarks (v1's "Saved" page): the empty state and its way out, then a saved
# recipe listed as a cream card, opened, unsaved from its disc and put back with Undo.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-saved"
- assertVisible:
    id: "cookmarks-empty"
- assertVisible: "Nothing saved yet"
- assertVisible: "0 items"
- takeScreenshot: cookmarks-empty
- tapOn:
    id: "cookmarks-empty-action"
- assertVisible: "Discover"
# Browse opened over Cookmarks: back twice to Home, where the side menu is.
- tapOn:
    id: "back"
- assertVisible:
    id: "cookmarks-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "feed-screen"

# Save one from its page
- runFlow:
    file: subflows/_open_recipe.yaml
    env:
      QUERY: carbonara
      RECIPE_ID: carbonara
- tapOn:
    id: "recipe-save"
- assertVisible: "Saved to Cookmarks"
- tapOn:
    id: "back"

- tapOn:
    id: "header-menu"
- assertVisible: "Cookmarks, 1"
- tapOn:
    id: "menu-saved"
- assertVisible: "1 item"
- assertVisible:
    id: "recipe-card-carbonara"
- takeScreenshot: cookmarks-one
- tapOn:
    id: "recipe-card-carbonara"
- assertVisible:
    id: "recipe-screen"
- assertVisible: "Saved"
- tapOn:
    id: "back"
- assertVisible:
    id: "cookmarks-screen"

# Unsave from the card's disc; Undo puts it back. The disc is inside the card,
# which is one button to iOS, so tap its spot: the photo's top-right corner.
- tapOn:
    id: "recipe-card-carbonara"
    point: "87%,8%"
- assertVisible: "Removed from Cookmarks"
- assertVisible:
    id: "cookmarks-empty"
- tapOn:
    id: "toast-undo"
- assertVisible:
    id: "recipe-card-carbonara"
