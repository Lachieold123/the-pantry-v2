# Scanning while the reader isn't connected (D-030, K-14): the Cupboard shows
# no scan buttons at all, only "Add a list". The scan sheet stays built for
# later; opened by its link it still says "Coming soon" plainly, shows no
# camera button that wouldn't work, closes with Not now, and "Add a list
# instead" leads to the typed list, which does work.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml
- tapOn:
    id: "tab-cupboard"

# Nothing in the Cupboard promises scanning.
- assertVisible:
    id: "cupboard-add-list"
- assertNotVisible:
    id: "cupboard-scan-receipt"
- assertNotVisible:
    id: "cupboard-scan-food"
- takeScreenshot: cupboard-no-scan

# Scan a receipt, by its link
- openLink: ${METRO_URL}/--/cupboard/scan?kind=receipt
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "scan-not-yet"
    timeout: 15000
- assertVisible: "Scan a receipt"
- assertVisible: "Coming soon"
- assertVisible: "Scanning isn’t switched on yet.*"
- assertNotVisible:
    id: "scan-camera"
- assertNotVisible:
    id: "scan-library"
- takeScreenshot: scan-receipt-coming-soon
- tapOn:
    id: "scan-not-now"
- assertNotVisible:
    id: "scan-not-yet"

# Photo of your food: the same honest note.
- openLink: ${METRO_URL}/--/cupboard/scan?kind=food
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "scan-not-yet"
    timeout: 15000
- assertVisible: "Photo of your food"
- assertVisible: "Coming soon"
- takeScreenshot: scan-food-coming-soon
# Add a list instead swaps to the typed list, and that really fills the cupboard.
- tapOn:
    id: "scan-use-list"
- assertVisible:
    id: "add-list-input"
- tapOn:
    id: "add-list-input"
- inputText: "eggs, feta"
- tapOn:
    id: "add-list-read"
- scrollUntilVisible:
    element:
      id: "add-list-commit"
    direction: DOWN
- tapOn:
    id: "add-list-commit"
- assertVisible: "\\d+ added to your cupboard"
- scrollUntilVisible:
    element:
      id: "cupboard-item-egg"
    direction: DOWN
