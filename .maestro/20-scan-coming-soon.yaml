# The Cupboard's scan sheets while the reader isn't connected (D-030): both say
# "Coming soon" plainly, show no camera button that wouldn't work, close with
# Not now, and "Add a list instead" leads to the typed list, which does work.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml
- tapOn:
    id: "tab-cupboard"

# Scan a receipt
- tapOn:
    id: "cupboard-scan-receipt"
- assertVisible:
    id: "scan-not-yet"
- assertVisible: "Scan a receipt"
- assertVisible: "Coming soon"
- assertVisible: "Scanning isn’t switched on yet.*"
- assertNotVisible:
    id: "scan-camera"
- assertNotVisible:
    id: "scan-library"
- takeScreenshot: scan-receipt-coming-soon
- tapOn:
    id: "scan-not-now"
- assertNotVisible:
    id: "scan-not-yet"
- assertVisible:
    id: "cupboard-screen"

# Photo of your food: the same honest note.
- tapOn:
    id: "cupboard-scan-food"
- assertVisible:
    id: "scan-not-yet"
- assertVisible: "Photo of your food"
- assertVisible: "Coming soon"
- takeScreenshot: scan-food-coming-soon

# Add a list instead swaps to the typed list, and that really fills the cupboard.
- tapOn:
    id: "scan-use-list"
- assertVisible:
    id: "add-list-input"
- tapOn:
    id: "add-list-input"
- inputText: "eggs, feta"
- tapOn:
    id: "add-list-read"
- scrollUntilVisible:
    element:
      id: "add-list-commit"
    direction: DOWN
- tapOn:
    id: "add-list-commit"
- assertVisible: "\\d+ added to your cupboard"
- scrollUntilVisible:
    element:
      id: "cupboard-item-egg"
    direction: DOWN
