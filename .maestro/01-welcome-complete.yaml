# First launch: answer the taste quiz, plan tonight's pick, decline the reminder.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_wait_for_app.yaml
- assertVisible:
    id: "welcome-start"
- assertVisible: "THE PANTRY"
- takeScreenshot: welcome-hello

- tapOn:
    id: "welcome-start"
- assertVisible: 'What do you eat\?'
- tapOn:
    id: "diet-vegetarian"
- tapOn:
    id: "avoid-nuts"
- takeScreenshot: welcome-eat
- scrollUntilVisible:
    element:
      id: "welcome-next"
- tapOn:
    id: "welcome-next"

# Back goes back a step and keeps the answers.
- assertVisible: 'What do you love\?'
- tapOn:
    id: "welcome-back"
- assertVisible: 'What do you eat\?'
- scrollUntilVisible:
    element:
      id: "welcome-next"
- tapOn:
    id: "welcome-next"

- assertVisible: 'What do you love\?'
- tapOn:
    id: "cuisine-italian"
- scrollUntilVisible:
    element:
      id: "weeknight-under-45"
- tapOn:
    id: "weeknight-under-45"
- takeScreenshot: welcome-like
- scrollUntilVisible:
    element:
      id: "welcome-next"
- tapOn:
    id: "welcome-next"

- assertVisible: "Tonight, for you"
- assertVisible:
    id: "welcome-pick"
- takeScreenshot: welcome-reveal
- runFlow:
    when:
      visible:
        id: "welcome-show-others"
    commands:
      - tapOn:
          id: "welcome-show-others"
      - assertVisible:
          id: "welcome-pick"
- tapOn:
    id: "welcome-cook-tonight"

- assertVisible: 'A nudge on Sundays\?'
- takeScreenshot: welcome-reminder
- tapOn:
    id: "welcome-not-now"

# Then the four-stop tour over Home (D-035): Next, Next, Next, Start cooking.
- extendedWaitUntil:
    visible:
      id: "tour"
    timeout: 15000
- assertVisible: "What I have"
- assertVisible: "1 of 4"
- takeScreenshot: tour-1-what-i-have
- tapOn:
    id: "tour-next"
- assertVisible: "Fill your cupboard"
- takeScreenshot: tour-2-cupboard
- tapOn:
    id: "tour-next"
- assertVisible: "Plan the week"
- tapOn:
    id: "tour-next"
- assertVisible: "Your shopping list"
- takeScreenshot: tour-4-list
- tapOn:
    id: "tour-done"
- assertNotVisible:
    id: "tour"

# Tonight's pick is on the plan, so Home leads with it.
- assertVisible: ".*Tonight · On the plan.*"
- assertVisible: "Plan, 1 planned"
- takeScreenshot: welcome-done-feed

# It doesn't come back on its own; Settings can replay it.
- tapOn:
    id: "header-avatar"
- scrollUntilVisible:
    element:
      id: "settings-replay-tour"
    direction: DOWN
- tapOn:
    id: "settings-replay-tour"
- extendedWaitUntil:
    visible:
      id: "tour"
    timeout: 10000
- tapOn:
    id: "tour-skip"
- assertNotVisible:
    id: "tour"
