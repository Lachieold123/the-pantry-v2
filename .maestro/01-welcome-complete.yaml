# First launch, in v1's order (P7): what brings you here, what you eat, cuisines,
# time and skill, a few taps in "What's in your cupboard?", "Tonight, for you",
# the notification primer, then Home on What I have with the tour and the
# first-run checklist.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_wait_for_app.yaml
- assertVisible:
    id: "welcome-start"
- assertVisible: "THE PANTRY"
- takeScreenshot: welcome-hello

- tapOn:
    id: "welcome-start"
- assertVisible: "What brings you here?"
- tapOn:
    id: "intent-plan"
- takeScreenshot: welcome-intent
- tapOn:
    id: "welcome-next"
- assertVisible: 'Anything you don.t eat\?'
# Nothing is required: until something is ticked the way on says "None of these".
- assertVisible: "None of these"
- tapOn:
    id: "avoid-nuts"
- assertVisible: "Continue"
- takeScreenshot: welcome-eat
- tapOn:
    id: "welcome-next"

# Back goes back a step and keeps the answers.
- assertVisible: "What do you love eating?"
- tapOn:
    id: "welcome-back"
- assertVisible: 'Anything you don.t eat\?'
- tapOn:
    id: "welcome-next"
- tapOn:
    id: "cuisine-italian"
- takeScreenshot: welcome-cuisines
- tapOn:
    id: "welcome-next"
- assertVisible: "How long do you have?"
- tapOn:
    id: "weeknight-under-30"
- scrollUntilVisible:
    element:
      id: "skill-starting"
- tapOn:
    id: "skill-starting"
- takeScreenshot: welcome-time-skill
- tapOn:
    id: "welcome-next"

- assertVisible: 'What.s in your cupboard\?'
- assertVisible: "Tap what you have"
- tapOn:
    id: "welcome-cupboard-garlic"
- tapOn:
    id: "welcome-cupboard-egg"
- scrollUntilVisible:
    element:
      id: "welcome-cupboard-chicken-thigh"
- tapOn:
    id: "welcome-cupboard-chicken-thigh"
- assertVisible: "3 things"
- takeScreenshot: welcome-cupboard
- tapOn:
    id: "welcome-next"

# "Tonight, for you": three picks; Spin again, then put one on tonight's plan.
- assertVisible: ".*Your menu.s ready.*"
- takeScreenshot: welcome-reveal
- tapOn:
    id: "welcome-spin"
- tapOn:
    id: "welcome-next"

# The primer shows the real Sunday reminder; "Allow notifications" brings up iOS's prompt.
- assertVisible:
    id: "welcome-notify"
- takeScreenshot: welcome-notify
- tapOn:
    id: "welcome-allow"
- tapOn:
    text: "Allow"
    optional: true

# Then the four-stop tour over Home (D-035): Next, Next, Next, Start cooking.
# Wait for the card, not just the dim: it appears once its spotlight has settled.
- extendedWaitUntil:
    visible:
      id: "tour-next"
    timeout: 15000
- assertVisible: "What I have"
- assertVisible: "1 of 4"
- takeScreenshot: tour-1-what-i-have
- tapOn:
    id: "tour-next"
- assertVisible: "Fill your cupboard"
- takeScreenshot: tour-2-cupboard
- tapOn:
    id: "tour-next"
- assertVisible: "Plan the week"
- tapOn:
    id: "tour-next"
- assertVisible: "Your shopping list"
- takeScreenshot: tour-4-list
- tapOn:
    id: "tour-done"
- assertNotVisible:
    id: "tour"

# Garlic, egg and chicken thigh make something tonight, so Home leads with What I have.
- assertVisible: ".*From 3 things in your cupboard.*"
# The first-run checklist: the cupboard and the plan are already done.
- assertVisible:
    id: "checklist"
- assertVisible: "2/4"
- takeScreenshot: welcome-done-feed
- tapOn:
    id: "checklist-dismiss"
- assertNotVisible:
    id: "checklist"

# It doesn't come back on its own; Settings can replay it.
- tapOn:
    id: "header-avatar"
- scrollUntilVisible:
    element:
      id: "settings-replay-tour"
    direction: DOWN
- tapOn:
    id: "settings-replay-tour"
# Wait for the card, not just the dim: it appears once its spotlight has settled.
- extendedWaitUntil:
    visible:
      id: "tour-next"
    timeout: 10000
- tapOn:
    id: "tour-skip"
- assertNotVisible:
    id: "tour"
