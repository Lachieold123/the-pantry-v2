# Plan: the day strip, add a meal to a slot, change who it's for, remove with
# undo, plan a suggestion; the shopping list: summary card, tick, remove with
# undo, add an extra, By aisle, clear all with undo, send it, both weeks.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml
- tapOn:
    id: "tab-plan"
- assertVisible:
    id: "plan-screen"
- assertVisible: "0 of 21 meals"
- assertVisible: "Add dinner"
- takeScreenshot: plan-empty

# The list is empty in both weeks
- tapOn:
    id: "tab-list"
- assertVisible: "Your list is empty"
- tapOn:
    id: "segment-next"
- assertVisible: "Your list is empty"
- tapOn:
    id: "segment-this"
- tapOn:
    id: "tab-week"

# Add dinner to today (the strip opens on today) from the Add sheet.
- tapOn:
    id: "plan-add-.*-dinner"
- assertVisible: "Add to .*"
- tapOn:
    id: "add-plan-search"
- inputText: "carbonara"
- tapOn:
    id: "add-plan-result-carbonara"
- assertVisible: "Carbonara planned for tonight"
- assertVisible:
    id: "plan-entry-[a-z0-9]+-[a-z0-9]+"
- assertVisible: "1 of 21 meals"
- takeScreenshot: plan-week

# Change who it's for: the "For 4" pill opens a small sheet with a stepper.
- tapOn:
    id: "plan-entry-.*-servings"
- assertVisible:
    id: "plan-servings-sheet"
- tapOn:
    id: "plan-entry-.*-stepper-plus"
- takeScreenshot: plan-servings-changed
- tapOn:
    id: "plan-servings-done"

# Remove, then undo
- tapOn:
    id: "plan-entry-.*-remove"
- assertVisible: "Carbonara taken off the plan"
- tapOn:
    id: "toast-undo"
- assertVisible:
    id: "plan-entry-[a-z0-9]+-[a-z0-9]+"

# Plan a suggestion for the next open meal (breakfast), then undo it.
- scrollUntilVisible:
    element:
      id: "plan-suggest-.*"
    direction: DOWN
    optional: true
- tapOn:
    id: "plan-suggest-.*"
    index: 0
    optional: true
- tapOn:
    id: "toast-undo"
    optional: true

# The black card opens the shopping list
- scrollUntilVisible:
    element:
      id: "plan-list-card"
    direction: DOWN
- assertVisible: ".* items? for 1 meal"
- tapOn:
    id: "plan-list-card"
- assertVisible:
    id: "shopping-share"
- assertVisible:
    id: "shopping-count"
- takeScreenshot: shopping-list
- tapOn:
    id: "shopping-item-guanciale"
- takeScreenshot: shopping-ticked

# Remove an item, then undo
- tapOn:
    id: "shopping-item-pecorino-remove"
- assertVisible: ".* removed from the list"
- tapOn:
    id: "toast-undo"
- assertVisible:
    id: "shopping-item-pecorino"

# Add something that isn't in any recipe
- scrollUntilVisible:
    element:
      id: "shopping-add-extra"
    direction: DOWN
- tapOn:
    id: "shopping-add-extra"
- inputText: "Paper towels"
- pressKey: Enter
- assertVisible: "Paper towels"

# A–Z instead of by aisle, and back
- scrollUntilVisible:
    element:
      id: "shopping-by-aisle"
    direction: UP
- tapOn:
    id: "shopping-by-aisle"
- takeScreenshot: shopping-a-to-z
- tapOn:
    id: "shopping-by-aisle"

# Clear all, then undo
- scrollUntilVisible:
    element:
      id: "shopping-clear"
    direction: UP
- tapOn:
    id: "shopping-clear"
- assertVisible: "List cleared"
- tapOn:
    id: "toast-undo"
- assertVisible:
    id: "shopping-item-pecorino"

# Send it: the share sheet opens; close it.
- scrollUntilVisible:
    element:
      id: "shopping-share"
    direction: UP
- tapOn:
    id: "shopping-share"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn:
    text: "Close"
    optional: true
- assertVisible:
    id: "plan-screen"

# Next week's list is still empty
- tapOn:
    id: "segment-next"
- assertVisible: "Your list is empty"
- tapOn:
    id: "segment-this"
- assertVisible:
    id: "shopping-share"
