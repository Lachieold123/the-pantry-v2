# Opens a recipe straight from a link, so Home is underneath and Back lands there.
# env: RECIPE_ID (the recipe to open). QUERY is no longer needed but harmless.
appId: host.exp.Exponent
---
- openLink: ${METRO_URL}/--/recipe/${RECIPE_ID}
- tapOn:
    text: "Open"
    optional: true
- extendedWaitUntil:
    visible:
      id: "recipe-screen"
    timeout: 15000
