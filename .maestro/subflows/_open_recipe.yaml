# Opens a recipe by searching for it on Browse.
# env: QUERY (what to type), RECIPE_ID (the card to tap).
# Start from any tab screen (the tab bar must be showing).
appId: host.exp.Exponent
---
- tapOn:
    id: "tab-browse"
- runFlow:
    when:
      visible:
        id: "browse-search-clear"
    commands:
      - tapOn:
          id: "browse-search-clear"
- tapOn:
    id: "browse-search"
- inputText: ${QUERY}
# Put the keyboard away so the tab bar is back when we return from the recipe.
- hideKeyboard
- tapOn:
    id: "recipe-card-${RECIPE_ID}"
- extendedWaitUntil:
    visible:
      id: "recipe-screen"
    timeout: 10000
