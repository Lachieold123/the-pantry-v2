# Gets past the first-launch welcome and taste quiz by tapping Skip, and
# leaves the app on the Feed. Run it straight after launchApp + openLink.
appId: com.lachlanoldfield.thepantry
---
- runFlow: _wait_for_app.yaml
- tapOn:
    id: "welcome-skip"
- extendedWaitUntil:
    visible:
      id: "feed-screen"
    timeout: 30000
