# Waits for The Pantry's development build to load its bundle after `openLink`.
# Only used straight after `launchApp: clearState: true`, so the app always
# opens on the welcome screen.
appId: com.lachlanoldfield.thepantry
---
# iOS may ask before a link opens the app ("Open in The Pantry?"). OS dialog, so optional.
- tapOn:
    text: "Open"
    optional: true
# The first bundle can take a while to build.
- extendedWaitUntil:
    visible:
      id: "welcome-skip"
    timeout: 240000
# The development build shows its developer-menu introduction on a fresh
# install. It is the dev client's own overlay, not the app, so close it only if
# it is there.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
