# Waits for The Pantry to finish loading in the development build after `openLink`
# (METRO_URL is thepantry://expo-development-client/?url=<Metro address>, see README).
# The Expo Go steps below (gear, "Continue") are guarded and only run if that overlay shows up.
# Only used straight after `launchApp: clearState: true`, so the app always
# opens on the welcome screen.
appId: com.lachlanoldfield.thepantry
---
# iOS asks before a link opens another app ("Open in Expo Go?"). OS dialog, so optional.
- tapOn:
    text: "Open"
    optional: true
# The first bundle can take a while to build.
- extendedWaitUntil:
    visible:
      id: "welcome-skip"
    timeout: 240000
# Expo Go shows its developer-menu introduction on a fresh install. It is
# Expo Go's own overlay, not the app, so close it only if it is there.
- waitForAnimationToEnd:
    timeout: 3000
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
# Expo Go (SDK 57) floats a "tools" gear over the top-right corner, right on
# top of the welcome screen's Skip, so taps meant for Skip open Expo's menu.
# Open that menu once from the gear and turn the button off. clearState
# brings it back on every launch, so this runs for every flow.
- runFlow:
    when:
      visible: "Gear Shape, Filled"
    commands:
      - tapOn: "Gear Shape, Filled"
      - scrollUntilVisible:
          element: "Tools button"
          direction: DOWN
      - tapOn: "Tools button"
      - tapOn: "Close"
      - waitForAnimationToEnd:
          timeout: 3000
