# Collections ("Your shelves"): create in the naming dialog, refuse a duplicate,
# open, rename and delete from the ⋯ sheet (with Undo), long-press actions, and
# a recipe added to one from its page showing in the mosaic and inside.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-collections"
- assertVisible: "Your shelves"
- assertVisible:
    id: "collections-empty"
- takeScreenshot: collections-empty

# Create
- tapOn:
    id: "collections-new"
- assertVisible:
    id: "name-dialog"
- inputText: "Weeknight dinners"
- tapOn:
    id: "name-dialog-save"
# A card reads as one button: its name and count together.
- assertVisible:
    id: "collection-card-.*"
- assertVisible: "Weeknight dinners, 0 recipes"
- assertVisible: "1 collection"

# A second one with the same name is refused; Cancel closes the dialog.
- tapOn:
    id: "collections-new"
- inputText: "weeknight dinners"
- assertVisible: "You already have a collection with that name."
- tapOn:
    id: "name-dialog-cancel"
- assertNotVisible:
    id: "name-dialog"

# Open, rename from the ⋯ sheet
- tapOn:
    id: "collection-card-.*"
- assertVisible:
    id: "collection-screen"
- assertVisible:
    id: "collection-empty"
- takeScreenshot: collection-empty
- tapOn:
    id: "collection-more"
- tapOn:
    id: "collection-rename"
- assertVisible:
    id: "name-dialog"
- eraseText: 20
- inputText: "Fridays"
- tapOn:
    id: "name-dialog-save"
- assertVisible: "Fridays"

# Delete goes back to the list; Undo brings it back.
- tapOn:
    id: "collection-more"
- tapOn:
    id: "collection-delete"
- assertVisible: "Fridays deleted"
- assertVisible:
    id: "collections-screen"
- tapOn:
    id: "toast-undo"
- assertVisible:
    id: "collection-card-.*"
- assertVisible: "Fridays, 0 recipes"

# A long press on the card opens the same actions.
- longPressOn:
    id: "collection-card-.*"
- assertVisible:
    id: "collection-rename"
- tapOn:
    id: "sheet-cancel"
- tapOn:
    id: "back"

# Add a recipe to it from the recipe page, then find it in the mosaic and inside.
- runFlow:
    file: subflows/_open_recipe.yaml
    env:
      QUERY: carbonara
      RECIPE_ID: carbonara
- tapOn:
    id: "recipe-more"
- tapOn:
    id: "action-collect"
- tapOn:
    id: "collect-row-.*"
- assertVisible: "Fridays, 1"
- tapOn:
    id: "sheet-close"
- tapOn:
    id: "back"
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-collections"
- assertVisible: "Fridays, 1 recipe"
- tapOn:
    id: "collection-card-.*"
- assertVisible:
    id: "recipe-card-carbonara"
- takeScreenshot: collection-with-recipe
