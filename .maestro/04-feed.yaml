# Home: the "What I have / Everything" switch, filter chips, five cards to swipe,
# the grid; a filter narrows both and "Clear filters" brings them back; tonight's
# planned dinner leads; with something in the cupboard, "What I have" shows it.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml
# A new cupboard is empty, so Home opens on Everything.
- assertVisible:
    id: "home-heroes"
- assertVisible: "What's cooking\\?"
- takeScreenshot: home

# "What I have" with an empty cupboard says so and points at the Cupboard.
- tapOn:
    id: "home-mode-pantry"
- assertVisible:
    id: "home-pantry-empty"
- takeScreenshot: home-pantry-empty
- tapOn:
    id: "home-mode-all"

# Swipe through the cards
- swipe:
    from:
      id: "home-heroes"
    direction: LEFT
- takeScreenshot: home-second-card

# A filter: Meal → Breakfast narrows the cards and the grid
- tapOn:
    id: "home-filter-meal"
- tapOn:
    id: "home-filter-option-breakfast"
- assertVisible: "Breakfast"
- takeScreenshot: home-breakfast
- tapOn:
    id: "home-filter-meal"
- tapOn:
    id: "home-filter-option-any"

# Nothing matches: say so, and clear the filters
- tapOn:
    id: "home-filter-cuisine"
- scrollUntilVisible:
    element:
      id: "home-filter-option-scandinavian"
    direction: DOWN
- tapOn:
    id: "home-filter-option-scandinavian"
- tapOn:
    id: "home-filter-time"
- tapOn:
    id: "home-filter-option-under-15"
- assertVisible:
    id: "home-no-match"
- tapOn:
    id: "home-no-match-action"
- assertVisible:
    id: "home-heroes"

# A card opens its recipe
- tapOn:
    id: "home-hero-.*"
    index: 0
- assertVisible:
    id: "recipe-screen"
- tapOn:
    id: "back"

# Plan carbonara for tonight; it leads the home page
- runFlow:
    file: subflows/_open_recipe.yaml
    env:
      QUERY: carbonara
      RECIPE_ID: carbonara
- tapOn:
    id: "recipe-plan"
- tapOn:
    id: "plan-day-this-0"
- tapOn:
    id: "plan-confirm"
- tapOn:
    id: "back"
- tapOn:
    id: "tab-index"
- assertVisible:
    id: "home-hero-carbonara"
- assertVisible: ".*Tonight · On the plan.*"
- takeScreenshot: home-tonight-planned

# Stock the cupboard a little, then "What I have" shows only what it can make.
- tapOn:
    id: "tab-cupboard"
- tapOn:
    id: "cupboard-add-list"
- tapOn:
    id: "add-list-input"
- inputText: "eggs, butter, milk, plain flour, sugar, bread, cheddar, ham, tomato, onion, garlic, rice, chicken thigh, soy sauce"
- tapOn:
    id: "add-list-read"
- tapOn:
    id: "add-list-commit"
- tapOn:
    id: "tab-index"
- tapOn:
    id: "home-mode-pantry"
- assertVisible: "From .* things in your cupboard · Change"
- takeScreenshot: home-what-i-have
