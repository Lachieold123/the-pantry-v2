# Cupboard: add by search (tap a suggestion, or press return for the top match), the scan sheets,
# remove with undo, the "move ticked shopping here" switch (and
# that ticking really moves it), and what-can-I-make results.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml
- tapOn:
    id: "tab-cupboard"
# The empty note sits under the ways to add things, so it can be below the fold.
- scrollUntilVisible:
    element:
      id: "cupboard-empty"
    direction: DOWN
- takeScreenshot: cupboard-empty
- scrollUntilVisible:
    element:
      id: "cupboard-search"
    direction: UP

# Add two ingredients by search: tap a suggestion (the field empties for the next one),
# then type and press return to add the top match.
- tapOn:
    id: "cupboard-search"
- inputText: "basmati"
- tapOn:
    id: "cupboard-add-basmati-rice"
- assertNotVisible:
    id: "cupboard-search-clear"
- tapOn:
    id: "cupboard-search"
- inputText: "egg"
- pressKey: Enter
# These pages don't hide the keyboard on a swipe, so tap plain text instead (it closes the keyboard).
- tapOn: 'What do you have\?'
# Both are in, under "Step 2", which starts below the ways to add things.
- scrollUntilVisible:
    element:
      id: "cupboard-item-basmati-rice"
    direction: DOWN
- assertVisible:
    id: "cupboard-item-egg"
- assertVisible: "Step 2 · 2 things"
- takeScreenshot: cupboard-two-items
- scrollUntilVisible:
    element:
      id: "cupboard-search"
    direction: UP

# Nonsense gets a plain "no such ingredient"
- tapOn:
    id: "cupboard-search"
- inputText: "zzqq"
- assertVisible: "No ingredient by that name.*"
- tapOn:
    id: "cupboard-search-clear"
- tapOn: 'What do you have\?'

# Scanning a receipt: not switched on yet, so the sheet says so and offers the typed list.
- tapOn:
    id: "cupboard-scan-receipt"
- assertVisible: "Scan a receipt"
- assertVisible: "Coming soon"
- takeScreenshot: cupboard-scan-not-yet
- tapOn:
    id: "scan-not-now"
- tapOn:
    id: "cupboard-scan-food"
- tapOn:
    id: "scan-use-list"
- assertVisible:
    id: "add-list-input"
- tapOn:
    id: "sheet-close"

# Remove, then undo
- scrollUntilVisible:
    element:
      id: "cupboard-item-egg"
    direction: DOWN
- tapOn:
    id: "cupboard-item-egg"
- assertVisible: "Egg used up"
- tapOn:
    id: "toast-undo"
- assertVisible:
    id: "cupboard-item-egg"

# "Add one thing" and the "Stock up" grid are gone (6 October): nothing between the jars and the rail.
- assertNotVisible: "Add one thing"
- assertNotVisible: "Tap what you have"

# The switch: off, then back on (it starts on).
- scrollUntilVisible:
    element:
      id: "cupboard-move-ticked"
    direction: DOWN
- tapOn:
    id: "cupboard-move-ticked"
- takeScreenshot: cupboard-move-ticked-off
- tapOn:
    id: "cupboard-move-ticked"

# What can I make? Open the first result.
- scrollUntilVisible:
    element:
      id: "match-.*"
    direction: UP
- takeScreenshot: cupboard-can-make
- tapOn:
    id: "match-.*"
    index: 0
- assertVisible:
    id: "recipe-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "cupboard-screen"

# With the switch on, ticking an item on the shopping list moves it here.
- runFlow:
    file: subflows/_open_recipe.yaml
    env:
      QUERY: carbonara
      RECIPE_ID: carbonara
- tapOn:
    id: "recipe-plan"
- tapOn:
    id: "plan-day-this-0"
# Two weeks of days, the meal and the stepper can push the button below the sheet's fold.
- scrollUntilVisible:
    element:
      id: "plan-confirm"
    direction: DOWN
- tapOn:
    id: "plan-confirm"
- assertVisible: "Carbonara planned for tonight"
- tapOn:
    id: "back"
- tapOn:
    id: "tab-plan"
- tapOn:
    id: "tab-list"
- tapOn:
    id: "shopping-item-guanciale"
- tapOn:
    id: "tab-cupboard"
# The tab keeps its scroll position, so go to the top and then down to the jars.
- scrollUntilVisible:
    element:
      id: "cupboard-search"
    direction: UP
- scrollUntilVisible:
    element:
      id: "cupboard-item-guanciale"
    direction: DOWN
- assertVisible: "Step 2 · 3 things"
- takeScreenshot: cupboard-moved-from-list
