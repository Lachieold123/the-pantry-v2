# The Pantry Pro (D-038). Pro isn't on sale yet, so nothing is limited and the
# paywall says so. A development build can preview the free limits from
# Settings; with them on, planning a day past the week you're shopping for
# opens Pro instead. (On Sundays the whole week ahead is free, so that part
# only runs Monday to Saturday.)
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml

# Settings: the Pro row opens an honest paywall.
- tapOn:
    id: "header-avatar"
- scrollUntilVisible:
    element:
      id: "settings-pro"
    direction: DOWN
- assertVisible: "Pro, Free, nothing limited yet"
- tapOn:
    id: "settings-pro"
- assertVisible: "The Pantry Pro"
- scrollUntilVisible:
    element:
      id: "pro-not-on-sale"
    direction: DOWN
- takeScreenshot: pro-paywall
- tapOn:
    id: "pro-done"

# Preview the free limits (development builds only).
- scrollUntilVisible:
    element:
      id: "settings-preview-limits"
    direction: DOWN
- tapOn:
    id: "settings-preview-limits"
- tapOn:
    id: "back"

- evalScript: "${output.weekday = new Date().getDay() !== 0 ? 'yes' : 'no'}"
- runFlow:
    when:
      true: ${output.weekday == 'yes'}
    commands:
      - runFlow:
          file: subflows/_open_recipe.yaml
          env:
            RECIPE_ID: carbonara
      - tapOn:
          id: "recipe-plan"
      - scrollUntilVisible:
          element:
            id: "plan-day-next-6"
          direction: DOWN
      - tapOn:
          id: "plan-day-next-6"
      - assertVisible: "Planning this far ahead is part of Pro."
      - scrollUntilVisible:
          element:
            id: "plan-confirm"
          direction: DOWN
      - assertVisible: "See Pro to plan this far ahead"
      - tapOn:
          id: "plan-confirm"
      - assertVisible: "Plan further ahead"
      - takeScreenshot: pro-plan-ahead
