# Surprise me (the spinner): the deck, settings and their pickers, tap the
# card to spin, spin again, Why this, how it works, plan it, cook this.
appId: host.exp.Exponent
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml

# From the side menu's Spinner
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-spinner"
- assertVisible:
    id: "spinner-card"
- assertVisible: "Tonight’s dinner"
- takeScreenshot: spinner-start
# "Why this" sits under the card.
- scrollUntilVisible:
    element:
      id: "spinner-why"
    direction: DOWN
- scrollUntilVisible:
    element:
      id: "spinner-card"
    direction: UP

# Tap the card: the deck runs for about a second, then lands
- tapOn:
    id: "spinner-card"
# "Tap card to spin" is hidden from VoiceOver (and so from tests). The buttons
# under the card are disabled while it spins, so wait for Spin again to come back.
- scrollUntilVisible:
    element:
      id: "spinner-spin"
    direction: DOWN
- extendedWaitUntil:
    visible:
      id: "spinner-spin"
      enabled: true
    timeout: 10000
- takeScreenshot: spinner-landed
- scrollUntilVisible:
    element:
      id: "spinner-time"
    direction: UP

# Settings: Time ≤ 15 min, then back to Any
- tapOn:
    id: "spinner-time"
- tapOn:
    id: "spinner-option-under-15"
- assertVisible: "≤ 15 min"
- tapOn:
    id: "spinner-time"
- tapOn:
    id: "spinner-option-any"
# Meal: Lunch changes the kicker
- tapOn:
    id: "spinner-meal"
- tapOn:
    id: "spinner-option-lunch"
- assertVisible: "Today’s lunch"
- tapOn:
    id: "spinner-meal"
- tapOn:
    id: "spinner-option-dinner"

# Spin again
- scrollUntilVisible:
    element:
      id: "spinner-spin"
    direction: DOWN
- tapOn:
    id: "spinner-spin"
# "Tap card to spin" is hidden from VoiceOver (and so from tests); the
# buttons are disabled while it spins, so wait for Spin again to come back.
- extendedWaitUntil:
    visible:
      id: "spinner-spin"
      enabled: true
    timeout: 10000

# How it works
- scrollUntilVisible:
    element:
      id: "spinner-info"
    direction: UP
- tapOn:
    id: "spinner-info"
- assertVisible:
    id: "spinner-how"
- tapOn:
    id: "spinner-how-close"

# Plan it opens the plan sheet for the pick, and comes back to the spinner
- scrollUntilVisible:
    element:
      id: "spinner-plan"
    direction: DOWN
- tapOn:
    id: "spinner-plan"
# Two weeks of days, the meal and the stepper can push the button below the sheet's fold.
- scrollUntilVisible:
    element:
      id: "plan-confirm"
    direction: DOWN
- tapOn:
    id: "plan-confirm"
- assertVisible: ".* planned for .*"
- assertVisible:
    id: "spinner-screen"

# Cook this opens the recipe
- tapOn:
    id: "spinner-cook"
- assertVisible:
    id: "recipe-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "spinner-screen"
