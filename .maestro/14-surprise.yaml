# Surprise me (the spinner): the deck, settings and their pickers, tap the
# card to spin, spin again, Why this, how it works, plan it, cook this.
appId: com.lachlanoldfield.thepantry
---
- launchApp:
    clearState: true
- openLink: ${METRO_URL}
- runFlow: subflows/_setup_skip_welcome.yaml

# From the side menu's Spinner
- tapOn:
    id: "header-menu"
- tapOn:
    id: "menu-spinner"
- assertVisible:
    id: "spinner-card"
- assertVisible: "Tonight’s dinner"
- assertVisible:
    id: "spinner-why"
- takeScreenshot: spinner-start

# Tap the card: the deck runs for about a second, then lands
- tapOn:
    id: "spinner-card"
- extendedWaitUntil:
    visible: "Tap card to spin"
    timeout: 10000
- takeScreenshot: spinner-landed

# Settings: Time ≤ 15 min, then back to Any
- tapOn:
    id: "spinner-time"
- tapOn:
    id: "spinner-option-under-15"
- assertVisible: "≤ 15 min"
- tapOn:
    id: "spinner-time"
- tapOn:
    id: "spinner-option-any"
# Meal: Lunch changes the kicker
- tapOn:
    id: "spinner-meal"
- tapOn:
    id: "spinner-option-lunch"
- assertVisible: "Today’s lunch"
- tapOn:
    id: "spinner-meal"
- tapOn:
    id: "spinner-option-dinner"

# Spin again
- scrollUntilVisible:
    element:
      id: "spinner-spin"
    direction: DOWN
- tapOn:
    id: "spinner-spin"
- extendedWaitUntil:
    visible: "Tap card to spin"
    timeout: 10000

# How it works
- scrollUntilVisible:
    element:
      id: "spinner-info"
    direction: UP
- tapOn:
    id: "spinner-info"
- assertVisible: "How Surprise me works"
- tapOn:
    id: "spinner-how-close"

# Plan it opens the plan sheet for the pick, and comes back to the spinner
- scrollUntilVisible:
    element:
      id: "spinner-plan"
    direction: DOWN
- tapOn:
    id: "spinner-plan"
- assertVisible:
    id: "plan-confirm"
- tapOn:
    id: "plan-confirm"
- assertVisible: ".* planned for .*"
- assertVisible:
    id: "spinner-screen"

# Cook this opens the recipe
- tapOn:
    id: "spinner-cook"
- assertVisible:
    id: "recipe-screen"
- tapOn:
    id: "back"
- assertVisible:
    id: "spinner-screen"
